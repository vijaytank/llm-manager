name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'

jobs:
  # Determine version and generate changelog
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Extract version from tag
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            TAG_NAME="${TAG}"
          else
            # Manual trigger - bump version
            CURRENT_VERSION=$(node -p "require('./ui/package.json').version")
            echo "Current version: $CURRENT_VERSION"
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            case "${{ github.event.inputs.version_type }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
            TAG_NAME="v$VERSION"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog for this version using npx
          CHANGELOG=$(npx --yes conventional-changelog-cli@latest -p angular -i CHANGELOG.md -s -r 0 2>/dev/null || echo "")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          npm pkg set version="${{ steps.version.outputs.version }}" --workspaces=false
          npm pkg set version="${{ steps.version.outputs.version }}" --workspace=ui

      - name: Update Cargo.toml version
        working-directory: ui/src-tauri
        run: |
          node -e 'const fs = require("fs"); let c = fs.readFileSync("Cargo.toml", "utf8"); c = c.replace(/(\[package\][\s\S]*?^version\s*=\s*)"[^"]+"/m, `$1"${process.argv[1]}"`); fs.writeFileSync("Cargo.toml", c);' "${{ steps.version.outputs.version }}"

      - name: Commit version bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui/package.json ui/src-tauri/Cargo.toml
          git commit -m "chore(release): ${{ steps.version.outputs.tag_name }}"
          git push origin HEAD:${{ github.ref_name }}

  # Build Frontend
  build-frontend:
    name: Build Frontend
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build production bundle
        working-directory: ui
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist-${{ needs.prepare-release.outputs.version }}
          path: ui/dist/
          retention-days: 30

  # Build Tauri App (Matrix across Windows, macOS, Linux)
  build-tauri:
    name: Build Tauri (${{ matrix.platform.name }})
    needs: [prepare-release, build-frontend]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      # fail-fast: false is intentional: allows all 3 OS platforms (Windows, macOS, Linux) to complete
      # independently and upload diagnostic artifacts even if one fails. The downstream create-release
      # job strictly depends on all matrix jobs via `needs: [prepare-release, build-tauri]`,
      # ensuring no partial release is published if any platform fails.
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tauri-windows
            bundle-path: ui/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
          - name: macOS
            os: macos-latest
            target: universal-apple-darwin
            artifact: tauri-macos
            bundle-path: ui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tauri-linux
            bundle-path: ui/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist-${{ needs.prepare-release.outputs.version }}
          path: ui/dist

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple Silicon and Intel targets (macOS)
        if: matrix.platform.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Install Tauri CLI
        working-directory: ui
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri App
        working-directory: ui
        run: npm run tauri build -- --target ${{ matrix.platform.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}-${{ needs.prepare-release.outputs.version }}
          path: ${{ matrix.platform.bundle-path }}
          retention-days: 30

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    needs: [prepare-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-*-${{ needs.prepare-release.outputs.version }}
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage*" -o -name "*.msi" | sort

      - name: Create Release
        uses: softprops/action-gh-release@c062e4933a388835f8e5d0a647e30d1d7cc91e60 # v2.2.1
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: LLM Manager ${{ needs.prepare-release.outputs.tag_name }}
          body: |
            ## LLM Manager ${{ needs.prepare-release.outputs.tag_name }}
            
            ${{ needs.prepare-release.outputs.changelog }}
            
            ### Downloads & Assets
            Please download the installer appropriate for your platform from the release assets below.
            
            ### Installation
            - **Windows**: Run the `.msi` installer
            - **macOS**: Open the `.dmg` and drag to Applications
            - **Linux**: Make AppImage executable (`chmod +x`) and run
            
            ### What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ needs.prepare-release.outputs.tag_name }}/CHANGELOG.md) for details.
          draft: false
          prerelease: false
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.dmg
            artifacts/*.AppImage*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
