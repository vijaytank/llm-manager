name: CI Pipeline

on:
  push:
    branches: [develop, main, feature/*]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # PowerShell Script Validation
  powershell-lint:
    name: PowerShell Lint & Test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run syntax check on all .ps1 files
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 -Exclude node_modules,dist,build,.git | ForEach-Object {
            try {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $_ -Raw), [ref]$null)
            } catch {
              $errors += "Syntax error in $($_.FullName): $($_.Exception.Message)"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "All PowerShell scripts passed syntax check"

      - name: Run test-health.ps1
        shell: pwsh
        run: |
          if (-not (Test-Path "script/test-health.ps1")) {
            Write-Error "test-health.ps1 not found"
            exit 1
          }
          .\script\test-health.ps1

  # Frontend TypeScript + Tests
  frontend:
    name: Frontend (TypeScript, Tests, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vitest tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 7

  # Rust Backend (Tauri)
  rust-backend:
    name: Rust Backend (Clippy, Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui/src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri -> target
          key: cargo-${{ runner.os }}-${{ hashFiles('ui/src-tauri/Cargo.lock') }}

      - name: Run cargo clippy
        run: cargo clippy -- -D clippy::all

      - name: Run cargo test
        run: cargo test --all

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

  # Python Context Manager
  python-context-manager:
    name: Python Context Manager (Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: llo-core/context_manager
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            llo-core/context_manager/requirements.txt
            llo-core/context_manager/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # Security Audits
  security-audit:
    name: Security Audits
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # npm audit (Frontend)
      - name: npm audit (Frontend)
        working-directory: ui
        run: |
          npm audit --audit-level=high
        continue-on-error: false

      # cargo audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # cargo audit (Rust)
      # Ignored Advisories:
      # - RUSTSEC-2024-0370: Unmaintained dependency in transitive closure; safe as no network exposure
      # - RUSTSEC-2024-0429: Transitive dependency advisory; verified safe in desktop context
      # - RUSTSEC-2026-0543: Informational warning: chrono unmaintained status (no vulnerability, no fix available)
      - name: cargo audit (Rust)
        working-directory: ui/src-tauri
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2026-0543
        continue-on-error: false

      # pip-audit
      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip audit (Python)
        working-directory: llo-core/context_manager
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip-audit -r requirements.txt -r requirements-dev.txt
        continue-on-error: false

  # Final status
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [powershell-lint, frontend, rust-backend, python-context-manager, security-audit]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.powershell-lint.result }}" != "success" ]] ||
             [[ "${{ needs.frontend.result }}" != "success" ]] ||
             [[ "${{ needs.rust-backend.result }}" != "success" ]] ||
             [[ "${{ needs.python-context-manager.result }}" != "success" ]] ||
             [[ "${{ needs.security-audit.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed!"
